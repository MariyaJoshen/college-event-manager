<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | College Event Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
      <div class="container">
        <a class="navbar-brand" href="/">College Event Manager</a>
      </div>
    </nav>

    <main class="container page-shell">
      <div class="card auth-card">
        <div class="text-center mb-4">
          <h2 class="fw-bold">Create your account</h2>
          <p class="text-muted">Join the campus community and start registering for events</p>
        </div>
        <div id="alertContainer"></div>
        <form id="registerForm">
          <div class="mb-3">
            <label class="form-label">Full name</label>
            <input class="form-control" type="text" name="name" placeholder="Student Name" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input class="form-control" type="email" name="email" placeholder="you@college.edu" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input class="form-control" type="password" name="password" placeholder="Create password" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Role</label>
            <select class="form-select" name="role">
              <option value="student">Student</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <button class="btn btn-primary w-100" type="submit">Register</button>
        </form>
        <p class="text-center mt-4 mb-0">Already have an account? <a href="/login">Login here</a></p>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
