<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | College Event Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
      <div class="container">
        <a class="navbar-brand" href="/">College Event Manager</a>
      </div>
    </nav>

    <main class="container page-shell">
      <div class="card auth-card">
        <div class="text-center mb-4">
          <h2 class="fw-bold">Welcome back</h2>
          <p class="text-muted">Sign in to manage events and registrations</p>
        </div>
        <div id="alertContainer"></div>
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input class="form-control" type="email" name="email" placeholder="student@college.edu" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input class="form-control" type="password" name="password" placeholder="Enter password" required />
          </div>
          <button class="btn btn-primary w-100" type="submit">Login</button>
        </form>

        <p class="text-center mt-4 mb-0">
          Need an account? <a href="/register">Register here</a>
        </p>
        <div class="mt-4 small text-muted">
          <p class="mb-1"><strong>Demo Admin:</strong> admin@college.edu / admin123</p>
          <p class="mb-0"><strong>Demo Student:</strong> student@college.edu / student123</p>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
