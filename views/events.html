<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events | College Event Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
      <div class="container">
        <a class="navbar-brand" href="/">College Event Manager</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-lg-center" id="authLinks" data-role-nav></ul>
        </div>
      </div>
    </nav>

    <main class="container page-shell">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
        <div>
          <h1 class="section-title mb-1">Campus events</h1>
          <p class="text-muted mb-0">Explore upcoming, ongoing, and past events.</p>
        </div>
      </div>

      <div class="card mb-4">
        <div class="card-body">
          <form id="eventFilters" class="row g-3 align-items-end">
            <div class="col-md-7">
              <label class="form-label">Search events</label>
              <input id="eventSearch" class="form-control" type="text" placeholder="Search by name..." />
            </div>
            <div class="col-md-3">
              <label class="form-label">Category</label>
              <select id="eventCategory" class="form-select">
                <option value="All">All categories</option>
                <option value="Technology">Technology</option>
                <option value="Cultural">Cultural</option>
                <option value="Workshop">Workshop</option>
                <option value="Career">Career</option>
              </select>
            </div>
            <div class="col-md-2 d-grid">
              <button type="submit" class="btn btn-primary">Filter</button>
            </div>
          </form>
        </div>
      </div>

      <div id="alertContainer"></div>
      <div class="row g-4" id="eventList"></div>
    </main>

    <footer>
      <div class="container text-center">
        <p class="mb-0">© 2026 College Event Manager</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
