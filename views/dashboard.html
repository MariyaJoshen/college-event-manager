<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | College Event Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
      <div class="container">
        <a class="navbar-brand" href="/">College Event Manager</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-lg-center" id="authLinks" data-role-nav></ul>
        </div>
      </div>
    </nav>

    <main class="container page-shell">
      <div id="alertContainer"></div>
      <h1 class="section-title">Dashboard</h1>
      <div id="dashboardStats" class="row g-4 mb-4"></div>

      <div class="row g-4">
        <div class="col-lg-6">
          <div class="card h-100">
            <div class="card-body">
              <h4>Recent announcements</h4>
              <ul class="list-group list-group-flush" id="recentAnnouncements"></ul>
            </div>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="card h-100">
            <div class="card-body">
              <h4>My registrations</h4>
              <ul class="list-group list-group-flush" id="studentEventList"></ul>
            </div>
          </div>
        </div>
      </div>

      <div id="adminPanel" class="mt-4 d-none">
        <div class="row g-4">
          <div class="col-lg-6">
            <div class="card h-100">
              <div class="card-body">
                <h4>Create event</h4>
                <form id="createEventForm">
                  <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input class="form-control" name="title" required />
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" name="description" rows="3" required></textarea>
                  </div>
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label class="form-label">Date</label>
                      <input class="form-control" type="date" name="date" required />
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Time</label>
                      <input class="form-control" type="time" name="time" required />
                    </div>
                  </div>
                  <div class="row g-3 mt-1">
                    <div class="col-md-6">
                      <label class="form-label">Venue</label>
                      <input class="form-control" name="venue" required />
                    </div>
                    <div class="col-md-3">
                      <label class="form-label">Category</label>
                      <select class="form-select" name="category" required>
                        <option value="Technology">Technology</option>
                        <option value="Cultural">Cultural</option>
                        <option value="Workshop">Workshop</option>
                        <option value="Career">Career</option>
                      </select>
                    </div>
                    <div class="col-md-3">
                      <label class="form-label">Capacity</label>
                      <input class="form-control" type="number" name="capacity" min="1" required />
                    </div>
                  </div>
                  <button class="btn btn-primary mt-3" type="submit">Create event</button>
                </form>
              </div>
            </div>
          </div>

          <div class="col-lg-6">
            <div class="card h-100">
              <div class="card-body">
                <h4>Publish announcement</h4>
                <form id="createAnnouncementForm">
                  <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input class="form-control" name="title" required />
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Message</label>
                    <textarea class="form-control" name="message" rows="4" required></textarea>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Priority</label>
                    <select class="form-select" name="priority">
                      <option value="Low">Low</option>
                      <option value="Medium" selected>Medium</option>
                      <option value="High">High</option>
                    </select>
                  </div>
                  <button class="btn btn-primary" type="submit">Publish</button>
                </form>
              </div>
            </div>
          </div>
        </div>

        <div class="card mt-4">
          <div class="card-body">
            <h4>Participants</h4>
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Event</th>
                    <th>Registered Date</th>
                  </tr>
                </thead>
                <tbody id="participantTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <div class="container text-center">
        <p class="mb-0">© 2026 College Event Manager</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
